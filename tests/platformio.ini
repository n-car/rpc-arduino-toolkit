[platformio]
src_dir = ProtocolRegression

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@6.21.0
    symlink://..
build_flags = -DNDEBUG

[esp32]
platform = espressif32@6.12.0
board = esp32dev

[esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2

[env:esp32-standard]
extends = esp32
build_flags = ${env.build_flags} -DRPC_ENABLE_SAFE_MODE=0

[env:esp32-safe]
extends = esp32
build_flags = ${env.build_flags} -DRPC_ENABLE_SAFE_MODE=1

[env:esp8266-standard]
extends = esp8266
build_flags = ${env.build_flags} -DRPC_ENABLE_SAFE_MODE=0

[env:esp8266-safe]
extends = esp8266
build_flags = ${env.build_flags} -DRPC_ENABLE_SAFE_MODE=1
